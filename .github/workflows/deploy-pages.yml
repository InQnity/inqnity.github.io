name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build static site
        run: bunx vite build --config vite.pages.config.ts

      - name: Add Pages helper files
        run: |
          touch dist/client/.nojekyll
          # SPA fallback so deep links / refreshes don't 404
          cp dist/client/index.html dist/client/404.html

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically if it isn't enabled yet in repo settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
